name: Update Market Data

on:
  schedule:
    # UTC 06:00 = 한국시간 15:00
    - cron: "0 6 * * 1-5"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Update market data
        run: |
          python <<'PY'

          import json
          import math
          import os
          import time
          import requests
          from datetime import datetime, timezone
          from concurrent.futures import ThreadPoolExecutor, as_completed


          # ============================================================
          # 기본 설정
          # ============================================================

          WATCHLIST_FILE = "watchlist.json"
          OUTPUT_FILE = "market-data.json"

          BASE_URLS = [
              "https://query1.finance.yahoo.com/v8/finance/chart/",
              "https://query2.finance.yahoo.com/v8/finance/chart/"
          ]

          HEADERS = {
              "User-Agent":
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/131.0 Safari/537.36",
              "Accept": "application/json,text/plain,*/*"
          }


          # ============================================================
          # BB 설정
          # ============================================================

          BB_PERIOD = 20
          BB_MULTIPLIER = 2.5


          # ============================================================
          # Yahoo Finance
          # ============================================================

          session = requests.Session()
          session.headers.update(HEADERS)


          def get_chart(symbol, interval="1d", range_="1y"):

              last_error = None

              for base in BASE_URLS:

                  url = base + requests.utils.quote(
                      symbol,
                      safe=""
                  )

                  params = {
                      "interval": interval,
                      "range": range_
                  }

                  for attempt in range(3):

                      try:

                          response = session.get(
                              url,
                              params=params,
                              timeout=20
                          )

                          if response.status_code == 429:
                              time.sleep(2 + attempt * 3)
                              continue

                          response.raise_for_status()

                          data = response.json()

                          chart = data.get("chart", {})

                          results = chart.get("result")

                          if not results:
                              raise RuntimeError(
                                  f"No Yahoo result for {symbol}"
                              )

                          result = results[0]

                          timestamps = result.get(
                              "timestamp",
                              []
                          )

                          quote = (
                              result
                              .get("indicators", {})
                              .get("quote", [{}])[0]
                          )

                          closes = quote.get(
                              "close",
                              []
                          )

                          rows = []

                          for ts, close in zip(
                              timestamps,
                              closes
                          ):

                              if close is None:
                                  continue

                              try:
                                  rows.append({
                                      "timestamp": int(ts),
                                      "close": float(close)
                                  })
                              except Exception:
                                  continue

                          meta = result.get(
                              "meta",
                              {}
                          )

                          price = meta.get(
                              "regularMarketPrice"
                          )

                          if price is None and rows:
                              price = rows[-1]["close"]

                          return {
                              "price":
                                  float(price)
                                  if price is not None
                                  else None,

                              "rows": rows
                          }

                      except Exception as e:

                          last_error = e

                          if attempt < 2:
                              time.sleep(
                                  1.5 + attempt * 2
                              )

                  time.sleep(0.5)

              raise RuntimeError(
                  f"Yahoo Finance failed: {symbol}: {last_error}"
              )


          # ============================================================
          # Bollinger Band
          # ============================================================

          def calculate_bb(
              values,
              period=BB_PERIOD,
              multiplier=BB_MULTIPLIER
          ):

              if len(values) < period:
                  return {
                      "middle": None,
                      "upper": None,
                      "lower": None
                  }

              arr = values[-period:]

              mean = sum(arr) / len(arr)

              variance = sum(
                  (x - mean) ** 2
                  for x in arr
              ) / len(arr)

              std = math.sqrt(variance)

              return {
                  "middle": mean,
                  "upper": mean + multiplier * std,
                  "lower": mean - multiplier * std
              }


          # ============================================================
          # watchlist.json 읽기
          #
          # 다양한 구조를 모두 허용
          #
          # 예:
          #
          # [
          #   {
          #     "ticker": "005930.KS",
          #     "name": "삼성전자"
          #   }
          # ]
          #
          # 또는
          #
          # {
          #   "watchlist": [...],
          #   "kospi500": [...],
          #   "nasdaq100": [...]
          # }
          # ============================================================

          def normalize_item(item, market=""):

              if isinstance(item, str):

                  return {
                      "ticker": item,
                      "name": item,
                      "nameKo": item,
                      "nameEn": item,
                      "market": market
                  }

              if not isinstance(item, dict):
                  return None

              ticker = (
                  item.get("ticker")
                  or item.get("symbol")
                  or item.get("code")
                  or item.get("yfTicker")
              )

              if not ticker:
                  return None

              name_ko = (
                  item.get("nameKo")
                  or item.get("name_ko")
                  or item.get("korean")
                  or item.get("name")
                  or ticker
              )

              name_en = (
                  item.get("nameEn")
                  or item.get("name_en")
                  or item.get("english")
                  or item.get("name")
                  or ticker
              )

              return {
                  "ticker": str(ticker).strip(),
                  "name": str(
                      item.get("name")
                      or name_ko
                      or name_en
                      or ticker
                  ),
                  "nameKo": str(name_ko),
                  "nameEn": str(name_en),
                  "market": (
                      item.get("market")
                      or market
                      or ""
                  )
              }


          def load_watchlist():

              if not os.path.exists(WATCHLIST_FILE):

                  raise RuntimeError(
                      "watchlist.json not found"
                  )

              with open(
                  WATCHLIST_FILE,
                  "r",
                  encoding="utf-8"
              ) as f:

                  data = json.load(f)

              items = []

              # --------------------------------------------------------
              # 배열 형태
              # --------------------------------------------------------

              if isinstance(data, list):

                  for item in data:

                      normalized = normalize_item(
                          item
                      )

                      if normalized:
                          items.append(normalized)

              # --------------------------------------------------------
              # 객체 형태
              # --------------------------------------------------------

              elif isinstance(data, dict):

                  groups = [
                      ("watchlist", "WATCHLIST"),
                      ("stocks", "WATCHLIST"),
                      ("kospi500", "KOSPI500"),
                      ("kospi_500", "KOSPI500"),
                      ("KOSPI500", "KOSPI500"),
                      ("nasdaq100", "NASDAQ100"),
                      ("nasdaq_100", "NASDAQ100"),
                      ("NASDAQ100", "NASDAQ100"),
                      ("kospi200", "KOSPI200"),
                      ("kospi_200", "KOSPI200"),
                      ("KOSPI200", "KOSPI200")
                  ]

                  found_group = False

                  for key, market in groups:

                      value = data.get(key)

                      if not isinstance(value, list):
                          continue

                      found_group = True

                      for item in value:

                          normalized = normalize_item(
                              item,
                              market
                          )

                          if normalized:
                              items.append(normalized)

                  # 혹시 단일 stocks object인 경우
                  if not found_group:

                      for key, value in data.items():

                          if isinstance(value, list):

                              for item in value:

                                  normalized = normalize_item(
                                      item,
                                      key
                                  )

                                  if normalized:
                                      items.append(
                                          normalized
                                      )

              # --------------------------------------------------------
              # 티커 중복 제거
              # --------------------------------------------------------

              unique = {}

              for item in items:

                  ticker = item["ticker"].upper()

                  if ticker not in unique:

                      unique[ticker] = item

                  else:

                      # 기존 이름이 티커뿐이면
                      # 더 자세한 이름으로 교체
                      old = unique[ticker]

                      if (
                          old["name"] == ticker
                          and item["name"] != ticker
                      ):

                          unique[ticker] = item

              result = list(unique.values())

              print(
                  f"Loaded {len(result)} unique symbols "
                  f"from {WATCHLIST_FILE}"
              )

              return result


          # ============================================================
          # 종목 하나 처리
          #
          # 1회 요청으로 1년 일봉을 받고
          # 주봉은 일봉에서 직접 계산
          #
          # 따라서 KOSPI500 + NASDAQ100을 처리할 때
          # 불필요한 2중 API 호출을 줄임
          # ============================================================

          def build_symbol(item):

              ticker = item["ticker"]

              try:

                  daily = get_chart(
                      ticker,
                      "1d",
                      "1y"
                  )

                  rows = daily["rows"]

                  daily_values = [
                      x["close"]
                      for x in rows
                  ]

                  # ----------------------------------------------------
                  # 일봉 BB
                  # ----------------------------------------------------

                  daily_bb = calculate_bb(
                      daily_values
                  )

                  # ----------------------------------------------------
                  # 주봉 데이터 생성
                  #
                  # timestamp를 기준으로 ISO week에 묶어서
                  # 마지막 종가를 사용
                  # ----------------------------------------------------

                  weekly_map = {}

                  for row in rows:

                      dt = datetime.fromtimestamp(
                          row["timestamp"],
                          tz=timezone.utc
                      )

                      year, week, _ = dt.isocalendar()

                      key = (
                          year,
                          week
                      )

                      weekly_map[key] = row["close"]

                  weekly_values = list(
                      weekly_map.values()
                  )

                  weekly_bb = calculate_bb(
                      weekly_values
                  )

                  return {
                      "ticker": ticker,
                      "name": item["name"],
                      "nameKo": item["nameKo"],
                      "nameEn": item["nameEn"],
                      "market": item["market"],

                      "price": daily["price"],

                      "daily": daily_bb,

                      "weekly": weekly_bb,

                      "dataPoints": len(rows)
                  }

              except Exception as e:

                  print(
                      f"STOCK ERROR | "
                      f"{ticker} | {e}"
                  )

                  return {
                      "ticker": ticker,
                      "name": item["name"],
                      "nameKo": item["nameKo"],
                      "nameEn": item["nameEn"],
                      "market": item["market"],

                      "price": None,

                      "daily": {
                          "middle": None,
                          "upper": None,
                          "lower": None
                      },

                      "weekly": {
                          "middle": None,
                          "upper": None,
                          "lower": None
                      },

                      "dataPoints": 0,

                      "error": str(e)
                  }


          # ============================================================
          # 주요 지수
          # ============================================================

          INDEX_LIST = [

              {
                  "ticker": "^GSPC",
                  "name": "S&P 500",
                  "nameKo": "S&P 500",
                  "nameEn": "S&P 500",
                  "market": "INDEX"
              },

              {
                  "ticker": "^NDX",
                  "name": "NASDAQ 100",
                  "nameKo": "나스닥 100",
                  "nameEn": "NASDAQ 100",
                  "market": "INDEX"
              },

              {
                  "ticker": "^KS11",
                  "name": "KOSPI",
                  "nameKo": "코스피",
                  "nameEn": "KOSPI",
                  "market": "INDEX"
              },

              {
                  "ticker": "^KS200",
                  "name": "KOSPI 200",
                  "nameKo": "코스피 200",
                  "nameEn": "KOSPI 200",
                  "market": "INDEX"
              }
          ]


          # ============================================================
          # VIX
          # ============================================================

          print("")
          print("=" * 70)
          print("VIX")
          print("=" * 70)

          try:

              vix = get_chart(
                  "^VIX",
                  "1d",
                  "1y"
              )

              vix_history = [
                  x["close"]
                  for x in vix["rows"]
              ]

              vix_output = {
                  "price": vix["price"],
                  "history": vix_history[-60:]
              }

              print(
                  f"VIX = {vix['price']}"
              )

          except Exception as e:

              print(
                  f"VIX ERROR: {e}"
              )

              vix_output = {
                  "price": None,
                  "history": []
              }


          # ============================================================
          # 주요 지수 처리
          # ============================================================

          print("")
          print("=" * 70)
          print("MAJOR INDICES")
          print("=" * 70)

          indices_output = {}

          for item in INDEX_LIST:

              ticker = item["ticker"]

              try:

                  result = build_symbol(
                      item
                  )

                  indices_output[ticker] = result

                  print(
                      f"OK | {ticker} | "
                      f"{result['price']}"
                  )

              except Exception as e:

                  print(
                      f"INDEX ERROR | "
                      f"{ticker} | {e}"
                  )

                  indices_output[ticker] = {
                      **item,
                      "price": None,
                      "daily": {
                          "middle": None,
                          "upper": None,
                          "lower": None
                      },
                      "weekly": {
                          "middle": None,
                          "upper": None,
                          "lower": None
                      },
                      "error": str(e)
                  }


          # ============================================================
          # 관심종목 / KOSPI500 / NASDAQ100
          # ============================================================

          watchlist = load_watchlist()

          print("")
          print("=" * 70)
          print(
              f"STOCKS : {len(watchlist)} symbols"
          )
          print("=" * 70)


          stocks_output = {}

          # 너무 많은 동시 요청으로 Yahoo가 429를
          # 반환하는 것을 막기 위해 4개씩 처리
          MAX_WORKERS = 4


          with ThreadPoolExecutor(
              max_workers=MAX_WORKERS
          ) as executor:

              futures = {
                  executor.submit(
                      build_symbol,
                      item
                  ): item
                  for item in watchlist
              }

              completed = 0

              for future in as_completed(
                  futures
              ):

                  item = futures[future]

                  try:

                      result = future.result()

                  except Exception as e:

                      print(
                          f"FATAL STOCK ERROR | "
                          f"{item['ticker']} | {e}"
                      )

                      result = {
                          "ticker": item["ticker"],
                          "name": item["name"],
                          "nameKo": item["nameKo"],
                          "nameEn": item["nameEn"],
                          "market": item["market"],
                          "price": None,
                          "daily": {
                              "middle": None,
                              "upper": None,
                              "lower": None
                          },
                          "weekly": {
                              "middle": None,
                              "upper": None,
                              "lower": None
                          },
                          "error": str(e)
                      }

                  stocks_output[
                      item["ticker"]
                  ] = result

                  completed += 1

                  if completed % 25 == 0:

                      print(
                          f"Progress: "
                          f"{completed}/"
                          f"{len(watchlist)}"
                      )


          # ============================================================
          # 최종 JSON
          # ============================================================

          output = {

              "generatedAt":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "vix":
                  vix_output,

              "indices":
                  indices_output,

              "stocks":
                  stocks_output,

              "summary": {

                  "totalSymbols":
                      len(watchlist),

                  "successfulSymbols":
                      sum(
                          1
                          for x in stocks_output.values()
                          if x.get("price") is not None
                      ),

                  "failedSymbols":
                      sum(
                          1
                          for x in stocks_output.values()
                          if x.get("price") is None
                      )
              }
          }


          # ============================================================
          # JSON 저장
          # ============================================================

          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print("=" * 70)
          print("UPDATE COMPLETE")
          print("=" * 70)

          print(
              f"Total symbols    : "
              f"{output['summary']['totalSymbols']}"
          )

          print(
              f"Successful       : "
              f"{output['summary']['successfulSymbols']}"
          )

          print(
              f"Failed           : "
              f"{output['summary']['failedSymbols']}"
          )

          print(
              f"Generated        : "
              f"{output['generatedAt']}"
          )

          PY

      - name: Validate market data
        run: |
          python - <<'PY'
          import json

          with open(
              "market-data.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          assert "generatedAt" in data
          assert "vix" in data
          assert "indices" in data
          assert "stocks" in data

          print("market-data.json validation OK")
          print(
              "Stocks:",
              len(data["stocks"])
          )
          print(
              "Indices:",
              len(data["indices"])
          )
          PY

      - name: Commit market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add market-data.json

          if git diff --cached --quiet; then
            echo "No market data changes."
          else
            git commit -m "Update market data"
            git push
          fi
