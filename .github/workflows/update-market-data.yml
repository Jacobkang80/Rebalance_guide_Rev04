name: Update Market Data

on:
  schedule:
    # 평일 UTC 06:00 = 한국시간 15:00
    - cron: "0 6 * * 1-5"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  update-market-data:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Repository
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Python
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================================
      # 3. Packages
      # ==========================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pykrx

      # ==========================================================
      # 4. Download / Generate Market Data
      # ==========================================================

      - name: Update market data
        env:
          PYTHONUNBUFFERED: "1"

        run: |

          python <<'PY'

          import os
          import json
          import math
          import time
          import requests
          import pandas as pd

          from datetime import datetime, timezone, timedelta
          from concurrent.futures import ThreadPoolExecutor, as_completed

          from pykrx import stock


          # ======================================================
          # 기본 설정
          # ======================================================

          YAHOO_BASE = "https://query1.finance.yahoo.com/v8/finance/chart/"

          USER_AGENT = (
              "Mozilla/5.0 (X11; Linux x86_64) "
              "AppleWebKit/537.36 "
              "(KHTML, like Gecko) "
              "Chrome/126 Safari/537.36"
          )

          HEADERS = {
              "User-Agent": USER_AGENT,
              "Accept": "application/json,text/plain,*/*"
          }

          SESSION = requests.Session()
          SESSION.headers.update(HEADERS)


          # ======================================================
          # 파일
          # ======================================================

          MARKET_FILE = "market-data.json"
          WATCH_FILE = "watchlist.json"


          # ======================================================
          # 사용자 지정 관심종목
          #
          # KOSPI TOP500 / NASDAQ100에 포함되지 않더라도
          # 아래 종목은 항상 유지됩니다.
          # ======================================================

          CUSTOM_STOCKS = [

              {
                  "ticker": "NVDA",
                  "name": "엔비디아",
                  "english": "NVIDIA",
                  "aliases": ["NVIDIA", "엔비디아"]
              },

              {
                  "ticker": "AAPL",
                  "name": "애플",
                  "english": "Apple",
                  "aliases": ["APPLE", "애플"]
              },

              {
                  "ticker": "005930.KS",
                  "name": "삼성전자",
                  "english": "Samsung Electronics",
                  "aliases": ["삼성전자", "Samsung"]
              },

              {
                  "ticker": "000660.KS",
                  "name": "SK하이닉스",
                  "english": "SK hynix",
                  "aliases": ["SK하이닉스", "하이닉스", "SK Hynix"]
              },

              {
                  "ticker": "007860.KS",
                  "name": "서연",
                  "english": "Seoyon",
                  "aliases": ["서연", "SEoyon"]
              }

          ]


          # ======================================================
          # Yahoo Finance Chart
          # ======================================================

          def yahoo_chart(symbol, interval="1d", range_="1y"):

              url = (
                  YAHOO_BASE
                  + requests.utils.quote(symbol, safe="")
              )

              params = {
                  "interval": interval,
                  "range": range_,
                  "events": "div,splits"
              }

              for attempt in range(3):

                  try:

                      r = SESSION.get(
                          url,
                          params=params,
                          timeout=20
                      )

                      r.raise_for_status()

                      data = r.json()

                      chart = data.get("chart", {})

                      result_list = chart.get("result")

                      if not result_list:
                          raise RuntimeError(
                              f"No Yahoo result: {symbol}"
                          )

                      result = result_list[0]

                      timestamps = result.get(
                          "timestamp",
                          []
                      )

                      quote = (
                          result
                          .get("indicators", {})
                          .get("quote", [{}])[0]
                      )

                      closes = quote.get(
                          "close",
                          []
                      )

                      rows = []

                      for ts, close in zip(
                          timestamps,
                          closes
                      ):

                          if close is None:
                              continue

                          try:

                              rows.append(
                                  {
                                      "timestamp": int(ts),
                                      "close": float(close)
                                  }
                              )

                          except Exception:
                              continue

                      if len(rows) < 20:

                          raise RuntimeError(
                              f"Not enough data: {symbol}"
                          )

                      meta = result.get(
                          "meta",
                          {}
                      )

                      price = meta.get(
                          "regularMarketPrice"
                      )

                      if price is None:

                          price = rows[-1]["close"]

                      return {
                          "price": float(price),
                          "rows": rows
                      }

                  except Exception as e:

                      if attempt == 2:

                          print(
                              "YAHOO ERROR",
                              symbol,
                              interval,
                              str(e)
                          )

                          return None

                      time.sleep(
                          1.5 * (attempt + 1)
                      )

              return None


          # ======================================================
          # BB 2.5σ
          # ======================================================

          def calculate_bb(
              values,
              period=20,
              multiplier=2.5
          ):

              if not values or len(values) < period:

                  return {
                      "middle": None,
                      "upper": None,
                      "lower": None
                  }

              arr = values[-period:]

              mean = (
                  sum(arr) /
                  len(arr)
              )

              variance = (
                  sum(
                      (x - mean) ** 2
                      for x in arr
                  )
                  / len(arr)
              )

              sd = math.sqrt(
                  max(variance, 0)
              )

              return {

                  "middle": mean,

                  "upper":
                      mean +
                      multiplier * sd,

                  "lower":
                      mean -
                      multiplier * sd

              }


          # ======================================================
          # 종목 데이터 생성
          # ======================================================

          def build_symbol(symbol):

              daily = yahoo_chart(
                  symbol,
                  "1d",
                  "1y"
              )

              weekly = yahoo_chart(
                  symbol,
                  "1wk",
                  "2y"
              )

              if daily is None:

                  return None

              daily_values = [
                  x["close"]
                  for x in daily["rows"]
              ]

              weekly_values = []

              if weekly:

                  weekly_values = [
                      x["close"]
                      for x in weekly["rows"]
                  ]

              return {

                  "price":
                      daily["price"],

                  "daily":
                      calculate_bb(
                          daily_values,
                          20,
                          2.5
                      ),

                  "weekly":
                      calculate_bb(
                          weekly_values,
                          20,
                          2.5
                      )

              }


          # ======================================================
          # 날짜
          # ======================================================

          now = datetime.now(
              timezone.utc
          )

          today = datetime.now().strftime(
              "%Y%m%d"
          )


          # ======================================================
          # KOSPI TOP 500
          #
          # pykrx를 이용하여 가장 최근 거래일의
          # KOSPI 시가총액 상위 500개를 가져옵니다.
          # ======================================================

          print("")
          print("=" * 70)
          print("KOSPI TOP 500")
          print("=" * 70)

          kospi_stocks = []

          try:

              # 최근 영업일을 찾기 위해 최대 10일 검색

              cap = None

              for offset in range(10):

                  d = (
                      datetime.now()
                      - timedelta(days=offset)
                  ).strftime("%Y%m%d")

                  try:

                      temp = stock.get_market_cap_by_ticker(
                          d,
                          market="KOSPI"
                      )

                      if temp is not None and not temp.empty:

                          cap = temp
                          today = d
                          break

                  except Exception as e:

                      print(
                          "KRX date error",
                          d,
                          e
                      )

              if cap is None or cap.empty:

                  raise RuntimeError(
                      "KOSPI market cap data unavailable"
                  )

              cap = cap.sort_values(
                  "시가총액",
                  ascending=False
              )

              cap = cap.head(500)

              for ticker in cap.index:

                  ticker = str(ticker).zfill(6)

                  try:

                      name = stock.get_market_ticker_name(
                          ticker
                      )

                  except Exception:

                      name = ticker

                  kospi_stocks.append(

                      {
                          "ticker":
                              ticker + ".KS",

                          "name":
                              name,

                          "english":
                              name,

                          "aliases":
                              [
                                  name,
                                  ticker
                              ],

                          "market":
                              "KOSPI",

                          "source":
                              "KOSPI_TOP500"

                      }

                  )

              print(
                  "KOSPI TOP500:",
                  len(kospi_stocks)
              )

          except Exception as e:

              print(
                  "KOSPI TOP500 ERROR:",
                  e
              )


          # ======================================================
          # NASDAQ-100
          #
          # Nasdaq 공식 구성종목 페이지를 우선 사용하고
          # 실패하면 Wikipedia 테이블을 사용합니다.
          # ======================================================

          print("")
          print("=" * 70)
          print("NASDAQ-100")
          print("=" * 70)

          nasdaq_stocks = []


          def get_nasdaq100():

              urls = [

                  "https://www.nasdaq.com/solutions/nasdaq-100/companies",

                  "https://en.wikipedia.org/wiki/Nasdaq-100"

              ]

              for url in urls:

                  try:

                      tables = pd.read_html(url)

                      for df in tables:

                          columns = [
                              str(x).lower()
                              for x in df.columns
                          ]

                          ticker_col = None
                          name_col = None

                          for i, col in enumerate(columns):

                              if (
                                  "symbol" in col
                                  or
                                  "ticker" in col
                              ):

                                  ticker_col = df.columns[i]

                              if (
                                  "company" in col
                                  or
                                  "name" in col
                              ):

                                  name_col = df.columns[i]

                          if (
                              ticker_col is None
                              or
                              name_col is None
                          ):

                              continue

                          for _, row in df.iterrows():

                              ticker = str(
                                  row[ticker_col]
                              ).strip()

                              name = str(
                                  row[name_col]
                              ).strip()

                              if (
                                  not ticker
                                  or ticker.lower()
                                  in [
                                      "nan",
                                      "symbol",
                                      "ticker"
                                  ]
                              ):

                                  continue

                              if (
                                  len(ticker) > 6
                                  or
                                  " " in ticker
                              ):

                                  continue

                              nasdaq_stocks.append(

                                  {
                                      "ticker":
                                          ticker,

                                      "name":
                                          name,

                                      "english":
                                          name,

                                      "aliases":
                                          [
                                              name,
                                              ticker
                                          ],

                                      "market":
                                          "NASDAQ",

                                      "source":
                                          "NASDAQ100"

                                  }

                              )

                          if len(nasdaq_stocks) >= 90:

                              break

                      if len(nasdaq_stocks) >= 90:

                          break

                  except Exception as e:

                      print(
                          "NASDAQ source error:",
                          url,
                          e
                      )


              # 중복 제거

              unique = {}

              for x in nasdaq_stocks:

                  unique[
                      x["ticker"]
                  ] = x

              return list(
                  unique.values()
              )


          nasdaq_stocks = get_nasdaq100()

          print(
              "NASDAQ100:",
              len(nasdaq_stocks)
          )


          if len(nasdaq_stocks) < 90:

              raise RuntimeError(
                  "NASDAQ-100 constituent retrieval failed. "
                  "Less than 90 constituents found."
              )


          # ======================================================
          # 기존 watchlist 유지
          # ======================================================

          old_watchlist = []

          if os.path.exists(WATCH_FILE):

              try:

                  with open(
                      WATCH_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      old = json.load(f)

                      if isinstance(old, dict):

                          old_watchlist = old.get(
                              "stocks",
                              []
                          )

                      elif isinstance(old, list):

                          old_watchlist = old

              except Exception as e:

                  print(
                      "Old watchlist read error:",
                      e
                  )


          # ======================================================
          # Watchlist 병합
          # ======================================================

          combined = []

          seen = set()


          def add_watch(item):

              ticker = item.get(
                  "ticker"
              )

              if not ticker:

                  return

              ticker = str(
                  ticker
              ).strip()

              if ticker in seen:

                  return

              seen.add(ticker)

              combined.append(

                  {
                      "ticker":
                          ticker,

                      "name":
                          item.get(
                              "name",
                              ticker
                          ),

                      "english":
                          item.get(
                              "english",
                              item.get(
                                  "name",
                                  ticker
                              )
                          ),

                      "aliases":
                          item.get(
                              "aliases",
                              [
                                  item.get(
                                      "name",
                                      ticker
                                  ),
                                  ticker
                              ]
                          ),

                      "market":
                          item.get(
                              "market",
                              "OTHER"
                          ),

                      "source":
                          item.get(
                              "source",
                              "CUSTOM"
                          )

                  }

              )


          for item in kospi_stocks:
              add_watch(item)

          for item in nasdaq_stocks:
              add_watch(item)

          for item in CUSTOM_STOCKS:
              add_watch(item)

          for item in old_watchlist:
              add_watch(item)


          # ======================================================
          # Watchlist 저장
          # ======================================================

          watch_output = {

              "generatedAt":
                  now.isoformat(),

              "counts": {

                  "kospiTop500":
                      len(kospi_stocks),

                  "nasdaq100":
                      len(nasdaq_stocks),

                  "total":
                      len(combined)

              },

              "stocks":
                  combined

          }


          with open(
              WATCH_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  watch_output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "WATCHLIST TOTAL:",
              len(combined)
          )


          # ======================================================
          # 데이터 수집 대상
          # ======================================================

          symbols = [
              x["ticker"]
              for x in combined
          ]


          # ======================================================
          # 주요 지수
          # ======================================================

          INDEX_SYMBOLS = {

              "^GSPC":
                  "S&P 500",

              "^NDX":
                  "Nasdaq 100",

              "^KS11":
                  "KOSPI",

              "^KS200":
                  "KOSPI 200"

          }


          # ======================================================
          # VIX
          # ======================================================

          print("")
          print("=" * 70)
          print("VIX")
          print("=" * 70)

          vix = yahoo_chart(
              "^VIX",
              "1d",
              "1y"
          )

          if vix:

              vix_history = [
                  x["close"]
                  for x in vix["rows"]
              ]

              vix_output = {

                  "price":
                      vix["price"],

                  "history":
                      vix_history[-60:]

              }

          else:

              vix_output = {

                  "price":
                      None,

                  "history":
                      []

              }


          # ======================================================
          # 주요 지수 수집
          # ======================================================

          indices_output = {}


          print("")
          print("=" * 70)
          print("INDEX DATA")
          print("=" * 70)


          for symbol, name in INDEX_SYMBOLS.items():

              print(
                  "Downloading:",
                  name,
                  symbol
              )

              data = build_symbol(
                  symbol
              )

              if data:

                  indices_output[
                      symbol
                  ] = data


          # ======================================================
          # 종목 데이터
          #
          # ThreadPoolExecutor로 병렬 수집
          # ======================================================

          stocks_output = {}

          total = len(symbols)

          print("")
          print("=" * 70)
          print(
              "STOCK DATA:",
              total
          )
          print("=" * 70)


          def worker(symbol):

              return (
                  symbol,
                  build_symbol(symbol)
              )


          completed = 0


          with ThreadPoolExecutor(
              max_workers=10
          ) as executor:

              futures = [
                  executor.submit(
                      worker,
                      symbol
                  )
                  for symbol in symbols
              ]

              for future in as_completed(
                  futures
              ):

                  try:

                      symbol, data = future.result()

                      if data:

                          stocks_output[
                              symbol
                          ] = data

                  except Exception as e:

                      print(
                          "WORKER ERROR:",
                          e
                      )

                  completed += 1

                  if (
                      completed % 25 == 0
                      or
                      completed == total
                  ):

                      print(
                          f"Progress: "
                          f"{completed}/{total} "
                          f"successful="
                          f"{len(stocks_output)}"
                      )


          # ======================================================
          # 최종 market-data.json
          # ======================================================

          output = {

              "generatedAt":
                  now.isoformat(),

              "dataDate":
                  today,

              "vix":
                  vix_output,

              "indices":
                  indices_output,

              "stocks":
                  stocks_output,

              "stats": {

                  "watchlist":
                      len(combined),

                  "dataSuccess":
                      len(stocks_output),

                  "dataFailed":
                      (
                          len(combined)
                          -
                          len(stocks_output)
                      )

              }

          }


          with open(
              MARKET_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          # ======================================================
          # 결과 출력
          # ======================================================

          print("")
          print("=" * 70)
          print("UPDATE COMPLETE")
          print("=" * 70)

          print(
              "KOSPI TOP500:",
              len(kospi_stocks)
          )

          print(
              "NASDAQ100:",
              len(nasdaq_stocks)
          )

          print(
              "WATCHLIST:",
              len(combined)
          )

          print(
              "MARKET DATA SUCCESS:",
              len(stocks_output)
          )

          print(
              "MARKET DATA FAILED:",
              len(combined)
              -
              len(stocks_output)
          )

          print(
              "VIX:",
              vix_output["price"]
          )

          print(
              "INDEXES:",
              len(indices_output)
          )

          print(
              "Generated:",
              now.isoformat()
          )

          PY


      # ==========================================================
      # 5. Validate generated files
      # ==========================================================

      - name: Validate JSON
        run: |

          python - <<'PY'

          import json
          import sys

          for filename in [
              "market-data.json",
              "watchlist.json"
          ]:

              with open(
                  filename,
                  "r",
                  encoding="utf-8"
              ) as f:

                  data = json.load(f)

              print(
                  filename,
                  "OK"
              )

              if filename == "market-data.json":

                  print(
                      "Stocks:",
                      len(
                          data.get(
                              "stocks",
                              {}
                          )
                      )
                  )

                  print(
                      "Indexes:",
                      len(
                          data.get(
                              "indices",
                              {}
                          )
                      )
                  )

                  print(
                      "VIX:",
                      data.get(
                          "vix",
                          {}
                      ).get(
                          "price"
                      )
                  )

              if filename == "watchlist.json":

                  print(
                      "Watchlist:",
                      len(
                          data.get(
                              "stocks",
                              []
                          )
                      )
                  )

          PY


      # ==========================================================
      # 6. Commit
      # ==========================================================

      - name: Commit market data
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            market-data.json \
            watchlist.json

          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit \
              -m "Update market data"

            git push

          fi
