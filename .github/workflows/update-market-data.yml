name: Update Market Data

on:
  schedule:
    # 한국시간 평일 오후 3시
    # UTC 06:00
    - cron: "0 6 * * 1-5"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  update-market-data:

    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------
      # Repository
      # -----------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # -----------------------------------------
      # Python
      # -----------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"


      # -----------------------------------------
      # Install
      # -----------------------------------------

      - name: Install dependencies
        run: |
          pip install requests pandas


      # -----------------------------------------
      # Download market data
      # -----------------------------------------

      - name: Download market data
        env:
          PYTHONUNBUFFERED: "1"

        run: |

          python <<'PY'

          import requests
          import json
          import math
          import time
          from datetime import datetime, timezone


          # =====================================================
          # 설정
          # =====================================================

          BASE_URL = "https://query1.finance.yahoo.com/v8/finance/chart/"

          HEADERS = {
              "User-Agent":
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 "
              "(KHTML, like Gecko) "
              "Chrome/128.0 Safari/537.36"
          }


          # =====================================================
          # KOSPI 200
          #
          # 주요 KOSPI 200 구성종목.
          #
          # 구성종목은 정기적으로 변경될 수 있으므로
          # 추후 이 배열만 교체하면 됩니다.
          # =====================================================

          KOSPI200 = [

              "005930.KS",
              "000660.KS",
              "373220.KS",
