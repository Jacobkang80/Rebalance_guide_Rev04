              "450080.KS",
              "454910.KS"

          ]


          # =====================================================
          # 사용자 관심종목
          # =====================================================

          try:

              with open(
                  "watchlist.json",
                  "r",
                  encoding="utf-8"
              ) as f:

                  watch_config = json.load(f)

          except Exception:

              watch_config = {
                  "custom": []
              }


          CUSTOM = watch_config.get(
              "custom",
              []
          )


          # 중복 제거

          CUSTOM = list(
              dict.fromkeys(CUSTOM)
          )


          # =====================================================
          # Yahoo Finance
          # =====================================================

          session = requests.Session()

          session.headers.update(
              HEADERS
          )


          def get_chart(
              symbol,
              interval="1d",
              range_="1y"
          ):

              url = (
                  BASE_URL
                  + requests.utils.quote(
                      symbol,
                      safe=""
                  )
                  + "?interval="
                  + interval
                  + "&range="
                  + range_
              )


              try:

                  response = session.get(
                      url,
                      timeout=20
                  )

                  response.raise_for_status()

                  data = response.json()

                  result = (
                      data
                      .get("chart", {})
                      .get("result", [None])[0]
                  )


                  if not result:

                      return None


                  timestamps = (
                      result.get(
                          "timestamp",
                          []
                      )
                  )


                  quote = (
                      result
                      .get("indicators", {})
                      .get("quote", [{}])[0]
                  )


                  closes = quote.get(
                      "close",
                      []
                  )


                  rows = []


                  for ts, close in zip(
                      timestamps,
                      closes
                  ):

                      if close is None:
                          continue

                      rows.append({
                          "timestamp": ts,
                          "close": float(close)
                      })


                  meta = result.get(
                      "meta",
                      {}
                  )


                  price = meta.get(
                      "regularMarketPrice"
                  )


                  if (
                      price is None
                      and rows
                  ):

                      price = rows[-1]["close"]


                  return {
                      "price":
                          float(price)
                          if price is not None
                          else None,

                      "rows": rows
                  }


              except Exception as e:

                  print(
                      "FETCH ERROR",
                      symbol,
                      str(e)
                  )

                  return None


          # =====================================================
          # BB
          # =====================================================

          def calculate_bb(
              values,
              period=20,
              multiplier=2.5
          ):

              if len(values) < period:

                  return {
                      "middle": None,
                      "upper": None,
                      "lower": None
                  }


              arr = values[-period:]


              mean = (
                  sum(arr)
                  / len(arr)
              )


              variance = (
                  sum(
                      (x - mean) ** 2
                      for x in arr
                  )
                  / len(arr)
              )


              sd = math.sqrt(
                  variance
              )


              return {

                  "middle": mean,

                  "upper":
                      mean
                      + multiplier * sd,

                  "lower":
                      mean
                      - multiplier * sd
              }


          # =====================================================
          # 종목 데이터
          # =====================================================

          def build_symbol(
              symbol
          ):

              daily = get_chart(
                  symbol,
                  "1d",
                  "1y"
              )


              weekly = get_chart(
                  symbol,
                  "1wk",
                  "2y"
              )


              if not daily:

                  return None


              daily_values = [
                  x["close"]
                  for x in daily["rows"]
              ]


              weekly_values = []


              if weekly:

                  weekly_values = [
                      x["close"]
                      for x in weekly["rows"]
                  ]


              return {

                  "price":
                      daily["price"],

                  "daily":
                      calculate_bb(
                          daily_values,
                          20,
                          2.5
                      ),

                  "weekly":
                      calculate_bb(
                          weekly_values,
                          20,
                          2.5
                      )

              }


          # =====================================================
          # VIX
          # =====================================================

          print("Downloading VIX...")


          vix_data = get_chart(
              "^VIX",
              "1d",
              "1y"
          )


          vix_history = []


          vix_price = None


          if vix_data:

              vix_price = (
                  vix_data["price"]
              )

              vix_history = [
                  x["close"]
                  for x in vix_data["rows"]
              ]


          # 최근 60 거래일

          vix_history = (
              vix_history[-60:]
          )


          # =====================================================
          # 결과
          # =====================================================

          output = {

              "generatedAt":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "vix": {

                  "price":
                      vix_price,

                  "history":
                      vix_history

              },

              "indices": {},

              "stocks": {},

              "kospi200": {},

              "errors": []

          }


          # =====================================================
          # 주요 지수
          # =====================================================

          INDICES = {

              "^GSPC":
                  "S&P 500",

              "^NDX":
                  "Nasdaq 100",

              "^KS11":
                  "KOSPI"

          }


          for symbol, name in INDICES.items():

              print(
                  "Downloading index:",
                  name
              )


              result = build_symbol(
                  symbol
              )


              if result:

                  result["name"] = name

                  output[
                      "indices"
                  ][symbol] = result

              else:

                  output[
                      "errors"
                  ].append(symbol)


              time.sleep(0.4)


          # =====================================================
          # KOSPI 200
          # =====================================================

          print(
              "Downloading KOSPI 200:",
              len(KOSPI200),
              "symbols"
          )


          for index, symbol in enumerate(
              KOSPI200,
              start=1
          ):

              print(
                  f"[{index}/{len(KOSPI200)}]",
                  symbol
              )


              try:

                  result = build_symbol(
                      symbol
                  )


                  if result:

                      output[
                          "kospi200"
                      ][symbol] = result

                  else:

                      output[
                          "errors"
                      ].append(symbol)


              except Exception as e:

                  print(
                      "KOSPI200 ERROR",
                      symbol,
                      e
                  )

                  output[
                      "errors"
                  ].append(symbol)


              # API 과부하 방지

              time.sleep(0.35)


          # =====================================================
          # 사용자 관심종목
          # =====================================================

          print(
              "Downloading custom watchlist"
          )


          for symbol in CUSTOM:

              # KOSPI200에 이미 있으면
              # 다시 요청하지 않음

              if symbol in output[
                  "kospi200"
              ]:

                  output[
                      "stocks"
                  ][symbol] = output[
                      "kospi200"
                  ][symbol]

                  continue


              result = build_symbol(
                  symbol
              )


              if result:

                  output[
                      "stocks"
                  ][symbol] = result

              else:

                  output[
                      "errors"
                  ].append(symbol)


              time.sleep(0.35)


          # =====================================================
          # 저장
          # =====================================================

          with open(
              "market-data.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "================================="
          )

          print(
              "Market data update complete"
          )

          print(
              "KOSPI200:",
              len(
                  output["kospi200"]
              )
          )

          print(
              "Custom:",
              len(
                  output["stocks"]
              )
          )

          print(
              "Errors:",
              len(
                  output["errors"]
              )
          )

          print(
              "VIX:",
              vix_price
          )

          print(
              "================================="
          )

          PY


      # -----------------------------------------
      # Commit
      # -----------------------------------------

      - name: Commit market data
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add market-data.json

          git diff --cached --quiet || \
            git commit \
            -m "Update market data"

          git push
